name: Security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  betterleaks:
    uses: netresearch/.github/.github/workflows/betterleaks.yml@main
    permissions:
      contents: read
      security-events: write

  dependency-review:
    if: github.event_name == 'pull_request'
    uses: netresearch/.github/.github/workflows/dependency-review.yml@main
    permissions:
      contents: read
      pull-requests: write

  composer-audit:
    uses: netresearch/typo3-ci-workflows/.github/workflows/security.yml@main
    with:
      # oro/platform 5.1.x requires php ~8.2.0; the reusable defaults to 8.5.
      php-version: '8.2'
